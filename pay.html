<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Payment — Snafu & Fubar</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

  <!-- Stripe Buy Button Script -->
  <script async src="https://js.stripe.com/v3/buy-button.js"></script>

  <style>
    :root {
      --oxblood: #5A1B2C;
      --oxblood-dark: #451222;
      --gold: #D6C095;
      --gold-light: #E8D6B3;
      --text: #F7F4EF;
      --text-muted: #9E867C;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--oxblood-dark);
      color: var(--text);
      font-family: "Inter", sans-serif;
      line-height: 1.7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .payment-card {
      background: var(--oxblood);
      border: 1px solid rgba(214, 192, 149, 0.3);
      border-radius: 12px;
      padding: 3rem 2rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .brand-kicker {
      color: var(--gold);
      font: 600 0.75rem/1.6 "JetBrains Mono", monospace;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: "Cinzel", Georgia, serif;
      color: var(--gold-light);
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    p {
      color: var(--text);
      font-size: 1rem;
      font-weight: 300;
      margin-bottom: 2rem;
      max-width: 450px;
      margin-left: auto;
      margin-right: auto;
    }

    .divider {
      width: 50px;
      height: 1px;
      background: var(--gold);
      margin: 2rem auto;
      opacity: 0.5;
    }

    /* Centers the Stripe button */
    .stripe-container {
      display: flex;
      justify-content: center;
      margin: 2rem 0;
    }

    .security-note {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2rem;
      margin-bottom: 0;
    }

    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: var(--gold);
      text-decoration: none;
      font-size: 0.9rem;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .back-link:hover {
      border-bottom-color: var(--gold);
    }
  </style>
</head>
<body>

  <div class="payment-card">
    <div class="brand-kicker">Snafu & Fubar</div>
    <h1>Secure Engagement Deposit</h1>
    
    <p>
      You are proceeding to our secure payment gateway. All transactions are encrypted and processed safely by Stripe.
    </p>

    <div class="divider"></div>

    <div class="stripe-container">
      <!-- YOUR STRIPE BUTTON -->
      <stripe-buy-button
        buy-button-id="buy_btn_1U7dQYL8hNtXK9e8Ijb23DB6"
        publishable-key="pk_live_51OzruVL8hNtXK9e8KGhmDZxMS3hWniyRq1phVqEygm8PLfAUqTCW8xv6EivvuGcvYJ32kGXmV5Ox20GzXPC5RtxF00Yeyq26Lb"
      >
      </stripe-buy-button>
    </div>

    <p class="security-note">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 5px;">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      Payments secured by Stripe. We never see or store your card details.
    </p>

    <a href="https://your-website-url.com" class="back-link">← Return to Snafu & Fubar</a>
  </div>

</body>
</html>
